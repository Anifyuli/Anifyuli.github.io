<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      id="favicon"
      type="image/svg+xml"
      href="/svg/favicon-l.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Moh. Anif Yuliansyah — self-taught programmer, Linux enthusiast, and FLOSS advocate."
    />
    <meta name="theme-color" content="#282828" />
    <link
        rel="preload"
        as="image"
        href="/img/ava.webp"
        imagesrcset="/img/ava-384.webp 384w, /img/ava.webp 768w"
        imagesizes="(max-width: 640px) 75vw, 384px"
        fetchpriority="high"
    />
    <link rel="stylesheet" href="./src/assets/style/custom.css" />
    <title>Welcome to my porto</title>
  </head>
  <script>
    (function () {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");

      function apply() {
        var stored = localStorage.getItem("theme") || "auto";
        var theme =
          stored === "auto" ? (mq.matches ? "dark" : "light") : stored;
        document.documentElement.setAttribute("data-theme", theme);

        var favicon = document.getElementById("favicon");
        if (favicon) {
          favicon.setAttribute(
            "href",
            theme === "dark" ? "/svg/favicon-d.svg" : "/svg/favicon-l.svg"
          );
        }
      }

      apply();
      mq.addEventListener("change", apply);
    })();
  </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
