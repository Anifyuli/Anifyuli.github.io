<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      id="favicon"
      type="image/svg+xml"
      href="/svg/favicon-l.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Moh. Anif Yuliansyah — self-taught programmer, Linux enthusiast, and FLOSS advocate."
    />
    <meta name="theme-color" content="#282828" />
    <link
        rel="preload"
        as="image"
        href="/img/ava.webp"
        imagesrcset="/img/ava-384.webp 384w, /img/ava.webp 768w"
        imagesizes="(max-width: 640px) 75vw, 384px"
        fetchpriority="high"
    />
    <link rel="stylesheet" href="./src/assets/style/custom.css" />
    <title>Welcome to my porto</title>
  </head>
  <script>
    (function () {
      const systemTheme = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches
        ? "dark"
        : "light";
      const currentTheme = localStorage.getItem("theme") || systemTheme;

      document.documentElement.setAttribute("data-theme", currentTheme);

      const favicon = document.getElementById("favicon");
      if (favicon) {
        favicon.setAttribute(
          "href",
          currentTheme === "dark" ? "/svg/favicon-d.svg" : "/svg/favicon-l.svg"
        );
      }

      window
        .matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", (e) => {
          const newTheme = e.matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", newTheme);
          if (favicon) {
            favicon.setAttribute(
              "href",
              newTheme === "dark" ? "/svg/favicon-d.svg" : "/svg/favicon-l.svg"
            );
          }
        });
    })();
  </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
